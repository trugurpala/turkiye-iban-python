name: Feature request
description: Suggest an in-scope Python client, documentation, or compatibility improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Keep requests focused on Turkish IBAN behavior, the shared data contract, or Python documentation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What developer problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe a small backward-compatible change.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm this proposal contains no real IBAN or personal financial data.
          required: true
