name: Özellik önerisi
description: Python istemcisi, belge veya uyumluluk kapsamında bir iyileştirme önerin.
title: "[Öneri]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Öneriyi Türkiye IBAN davranışı, ortak veri sözleşmesi veya Python belgeleri kapsamında tutun. Gerçek IBAN veya kişisel finansal veri eklemeyin.
  - type: textarea
    id: problem
    attributes:
      label: Sorun
      description: Bu öneri hangi kullanıcı veya geliştirici sorununu çözmeli?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Önerilen çözüm
      description: Küçük ve geriye uyumlu bir değişikliği açıklayın.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Gizlilik onayı
      options:
        - label: Bu önerinin gerçek IBAN veya kişisel finansal veri içermediğini onaylıyorum.
          required: true
