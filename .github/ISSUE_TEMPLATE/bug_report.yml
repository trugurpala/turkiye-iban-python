name: Hata bildirimi
description: Sentetik veriyle tekrar üretilebilen bir Python istemci hatasını bildirin.
title: "[Hata]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gerçek IBAN, hesap sahibi, müşteri verisi, üretim logu veya bunları içeren ekran görüntüsü eklemeyin. Güvenlik açığını SECURITY.md içindeki özel kanaldan bildirin.
  - type: textarea
    id: summary
    attributes:
      label: Hatanın özeti
      description: Ne oldu, ne olmasını bekliyordunuz?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: En küçük tekrar örneği
      description: Yalnız sentetik veri kullanan en küçük Python örneğini verin.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Paket ve Python sürümü
      placeholder: "turkiye-iban v0.1.6, Python 3.12"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Gizlilik onayı
      options:
        - label: Bu bildirimin gerçek IBAN veya kişisel finansal veri içermediğini onaylıyorum.
          required: true
