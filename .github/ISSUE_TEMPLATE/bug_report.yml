name: Bug report
description: Report a reproducible Python client problem using synthetic data only.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real IBANs, account holders, customer data, logs, or screenshots.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal Python example with synthetic data only.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package and Python version
      placeholder: "turkiye-iban v0.1.3, Python 3.12"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm this report contains no real IBAN or personal financial data.
          required: true
