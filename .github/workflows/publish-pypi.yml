name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Package index to publish to"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
      ref:
        description: "Version tag containing the package to publish, for example v0.1.4"
        required: true
        default: main
        type: string

concurrency:
  group: publish-python-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify version tag matches package metadata
        shell: bash
        run: |
          case "${{ inputs.ref }}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "The publish ref must be a version tag such as v0.1.4."; exit 1 ;;
          esac
          VERSION="${{ inputs.ref }}"
          VERSION="${VERSION#v}"
          PACKAGE_VERSION="$(python -c "import pathlib, re; print(re.search(r'^version = \"([^\"]+)\"$', pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")"
          test "$VERSION" = "$PACKAGE_VERSION"
      - run: python -m pytest
      - run: python -m mypy src
      - run: python -m build --sdist --wheel --outdir dist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.repository }}
      url: https://${{ inputs.repository == 'pypi' && 'pypi.org' || 'test.pypi.org' }}/p/turkiye-iban
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.repository == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          skip-existing: true
